<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RE Insight — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #0a0a0b;
    --surface:    #111113;
    --surface2:   #18181c;
    --border:     #222228;
    --border2:    #2e2e38;
    --accent:     #e8ff47;
    --accent-dim: #c8df30;
    --text:       #f0f0f0;
    --text-muted: #6b6b7a;
    --text-dim:   #9898a8;
    --error:      #ff4757;
    --success:    #2ed573;
    --font-head:  'Syne', sans-serif;
    --font-mono:  'JetBrains Mono', monospace;
    --font-body:  'Inter', sans-serif;
    --radius:     12px;
    --radius-sm:  8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, var(--bg) 100%);
    pointer-events: none;
  }

  .login-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 44px 40px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 0 1px rgba(232,255,71,0.04), 0 32px 80px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(20px);
    animation: cardIn 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 20px; height: 20px; }

  .logo-name {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-left: 46px;
    margin-bottom: 36px;
  }

  .login-heading {
    font-family: var(--font-head);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input::placeholder { color: var(--text-muted); }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(232,255,71,0.12);
  }

  .error-msg {
    background: #1a0a0a;
    border: 1px solid #3a1010;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--error);
    margin-bottom: 18px;
    display: none;
    animation: shake 0.35s ease;
  }

  .error-msg.show { display: block; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s;
    letter-spacing: 0.01em;
    margin-top: 4px;
  }

  .login-btn:hover { background: var(--accent-dim); transform: translateY(-1px); }
  .login-btn:active { transform: translateY(0); }

  .login-footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .login-footer-text { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
          <rect x="3" y="10" width="18" height="11" rx="2"/>
          <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
          <circle cx="12" cy="16" r="1.5" fill="#000" stroke="none"/>
        </svg>
      </div>
      <span class="logo-name">RE Insight</span>
    </div>
    <div class="logo-sub">Real Estate Intelligence</div>

    <div class="login-heading">Welcome back</div>
    <div class="login-sub">Sign in to access your portfolio dashboard.</div>

    <div id="error-msg" class="error-msg">⚠ Invalid username or password.</div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="handleLoginKey(event)" />
    </div>

    <button class="login-btn" onclick="doLogin()">Sign In →</button>

    <div class="login-footer">
      <span class="status-dot"></span>
      <span class="login-footer-text">Secure connection · RE Insight v2.1</span>
    </div>
  </div>
</div>

<script>
  const USERS = {
    'Admin':   { password: 'admin123', role: 'admin',  displayName: 'Admin',   roleLabel: 'Administrator' },
    'Ritessh': { password: 'ritessh123', role: 'user', displayName: 'Ritessh', roleLabel: 'Analyst' },
  };

  function handleLoginKey(e) {
    if (e.key === 'Enter') doLogin();
  }

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    const user = USERS[username];
    if (!user || user.password !== password) {
      errorMsg.classList.remove('show');
      void errorMsg.offsetWidth;
      errorMsg.classList.add('show');
      document.getElementById('password').value = '';
      return;
    }

    // Store session info for dashboard to read
    sessionStorage.setItem('re_user', JSON.stringify({ username, ...user }));

    // Navigate to dashboard
    window.location.href = 'index.html';
  }

  document.getElementById('username').focus();
</script>
</body>
</html>
