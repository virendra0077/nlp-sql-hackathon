<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RE Insight — Real Estate Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #0a0a0b;
    --surface:    #111113;
    --surface2:   #18181c;
    --border:     #222228;
    --border2:    #2e2e38;
    --accent:     #e8ff47;
    --accent-dim: #c8df30;
    --text:       #f0f0f0;
    --text-muted: #6b6b7a;
    --text-dim:   #9898a8;
    --user-bg:    #1a1a20;
    --agent-bg:   #111113;
    --sql-bg:     #0d0d10;
    --error:      #ff4757;
    --success:    #2ed573;
    --font-head:  'Syne', sans-serif;
    --font-mono:  'JetBrains Mono', monospace;
    --font-body:  'Inter', sans-serif;
    --radius:     12px;
    --radius-sm:  8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  /* ── Layout ── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 100vh;
    height: 100vh;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  .logo-name {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-left: 42px;
    margin-top: -2px;
  }

  .sidebar-section {
    padding: 16px 14px 8px;
  }

  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 6px;
    margin-bottom: 8px;
  }

  .sample-btn {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 9px 10px;
    text-align: left;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.15s ease;
    margin-bottom: 3px;
    display: block;
  }

  .sample-btn:hover {
    background: var(--surface2);
    border-color: var(--border2);
    color: var(--text);
  }

  .sample-btn .sample-icon {
    display: inline-block;
    margin-right: 6px;
    opacity: 0.5;
    font-style: normal;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--success);
    border-radius: 50%;
    margin-right: 7px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Main ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* ── Top bar ── */
  .topbar {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--bg);
  }

  .topbar-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }

  .topbar-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-family: var(--font-body);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.5s 0.2s forwards;
  }

  .empty-icon {
    width: 56px;
    height: 56px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }

  .empty-icon svg { width: 26px; height: 26px; opacity: 0.4; }

  .empty-title {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .empty-sub {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    max-width: 340px;
    line-height: 1.6;
  }

  /* ── Message ── */
  .message-row {
    padding: 6px 28px;
    opacity: 0;
    transform: translateY(8px);
    animation: slideIn 0.25s forwards;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  @keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .message-row.user-row { padding-top: 12px; }

  .message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .avatar {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: var(--font-head);
  }

  .avatar.user { background: var(--accent); color: #000; }
  .avatar.agent { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border2); }

  .message-sender {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .message-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
    opacity: 0.6;
  }

  .message-bubble {
    margin-left: 32px;
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.65;
    border: 1px solid transparent;
  }

  .user-row .message-bubble {
    background: var(--user-bg);
    border-color: var(--border);
    color: var(--text);
  }

  .agent-row .message-bubble {
    background: transparent;
    padding: 0;
    border: none;
  }

  /* ── Result card ── */
  .result-card {
    margin-left: 32px;
  }

  .result-answer {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
  }

  .result-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .result-value {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -1px;
    line-height: 1;
  }

  .result-value.text-result {
    font-size: 15px;
    font-weight: 400;
    font-family: var(--font-body);
    color: var(--text);
    letter-spacing: 0;
    line-height: 1.6;
  }

  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 4px;
  }

  .result-table td {
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .result-table tr:last-child td { border-bottom: none; }

  /* ── SQL toggle ── */
  .sql-toggle {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    font-family: var(--font-body);
    transition: color 0.15s;
  }

  .sql-toggle:hover { color: var(--text); }

  .sql-toggle svg {
    width: 14px;
    height: 14px;
    transition: transform 0.2s;
  }

  .sql-toggle.open svg { transform: rotate(90deg); }

  .sql-block {
    background: var(--sql-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-top: 8px;
    overflow-x: auto;
    display: none;
  }

  .sql-block.visible { display: block; }

  .sql-block pre {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* SQL syntax highlight */
  .kw { color: #c792ea; }
  .fn { color: #82aaff; }
  .str { color: #c3e88d; }
  .num { color: #f78c6c; }
  .cmt { color: #546e7a; font-style: italic; }

  /* ── Duration badge ── */
  .duration-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 8px;
    font-family: var(--font-mono);
  }

  /* ── Error ── */
  .error-card {
    margin-left: 32px;
    background: #1a0a0a;
    border: 1px solid #3a1010;
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--error);
    font-family: var(--font-mono);
    line-height: 1.6;
  }

  /* ── Thinking ── */
  .thinking-row {
    padding: 6px 28px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  .thinking {
    margin-left: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .thinking-dots {
    display: flex;
    gap: 4px;
  }

  .thinking-dots span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1.2s infinite;
    opacity: 0.3;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* ── Input area ── */
  .input-area {
    padding: 16px 28px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  /* Override for full-width positioning */
  .input-wrapper-outer {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 16px 0 20px;
    flex-shrink: 0;
  }

  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 12px 14px 12px 18px;
    transition: border-color 0.2s;
  }

  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22;
  }

  .input-box textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    min-height: 22px;
    max-height: 120px;
    overflow-y: auto;
  }

  .input-box textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .send-btn:hover { background: var(--accent-dim); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .input-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    padding: 0 4px;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
            <rect x="3" y="10" width="18" height="11" rx="2"/>
            <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
            <circle cx="12" cy="16" r="1.5" fill="#000" stroke="none"/>
          </svg>
        </div>
        <span class="logo-name">RE Insight</span>
      </div>
      <div class="logo-sub">Real Estate Intelligence</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Try asking</div>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">₹</i>What are the sales in Prabadevi Address?
      </button>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">₹</i>What are the balance receivables in Prabadevi Address?
      </button>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">📍</i>Which assets are located in the North?
      </button>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">📐</i>What is the area sold in Goa Villas?
      </button>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">📊</i>Which asset has the least sales?
      </button>
      <button class="sample-btn" onclick="fillQuestion(this)">
        <i class="sample-icon">🏆</i>Which region has the highest receivables?
      </button>
    </div>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Connected to database</span>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar-title">SQL Agent Chat</div>
        <div class="topbar-meta" id="msg-count">No messages yet</div>
      </div>
      <button class="clear-btn" onclick="clearChat()">Clear chat</button>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="empty-title">Ask anything about your portfolio</div>
        <div class="empty-sub">Query your real estate data in plain English. Sales figures, receivables, zone performance — just ask.</div>
      </div>
    </div>

    <div class="input-wrapper-outer">
      <div class="input-area">
        <div class="input-box">
          <textarea
            id="question-input"
            placeholder="Ask a question about your real estate data…"
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="send-btn" onclick="sendQuestion()" title="Send (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">Press <kbd style="background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);font-size:10px;">Enter</kbd> to send &nbsp;·&nbsp; <kbd style="background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);font-size:10px;">Shift+Enter</kbd> for new line</div>
      </div>
    </div>

  </main>
</div>

<script>
  // ── Config ──
  const API_URL = 'http://localhost:8000';
  let messageCount = 0;
  let isLoading = false;

  // ── Helpers ──
  function getTime() {
    return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function fillQuestion(btn) {
    const text = btn.textContent.replace(/^[₹📍📐📊🏆]\s*/u, '').trim();
    const input = document.getElementById('question-input');
    input.value = text;
    autoResize(input);
    input.focus();
  }

  function clearChat() {
    const chatArea = document.getElementById('chat-area');
    const emptyState = document.getElementById('empty-state');
    chatArea.innerHTML = '';
    chatArea.appendChild(emptyState);
    emptyState.style.display = 'flex';
    messageCount = 0;
    updateMsgCount();
  }

  function updateMsgCount() {
    const el = document.getElementById('msg-count');
    el.textContent = messageCount === 0
      ? 'No messages yet'
      : `${messageCount} message${messageCount !== 1 ? 's' : ''}`;
  }

  function highlightSQL(sql) {
    const keywords = /\b(SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|ON|AND|OR|IN|NOT|AS|GROUP BY|ORDER BY|HAVING|LIMIT|INSERT|UPDATE|DELETE|WITH|UNION|CASE|WHEN|THEN|ELSE|END|BY|DISTINCT|COUNT|SUM|AVG|MIN|MAX|COALESCE|CAST|NULL|IS|LIKE|ILIKE|TRUE|FALSE)\b/gi;
    const strings = /'([^']*)'/g;
    const nums = /\b(\d+\.?\d*)\b/g;

    return sql
      .replace(strings, '<span class="str">\'$1\'</span>')
      .replace(keywords, '<span class="kw">$&</span>')
      .replace(nums, '<span class="num">$&</span>');
  }

  function scrollToBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  // ── Render messages ──
  function appendUserMessage(question) {
    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.style.display = 'none';

    const chatArea = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'message-row user-row';
    row.innerHTML = `
      <div class="message-header">
        <div class="avatar user">Y</div>
        <span class="message-sender">You</span>
        <span class="message-time">${getTime()}</span>
      </div>
      <div class="message-bubble">${escapeHtml(question)}</div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function appendThinking() {
    const chatArea = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'thinking-row';
    row.id = 'thinking-row';
    row.innerHTML = `
      <div class="message-header" style="padding:0 0 0 32px;margin-bottom:0">
        <div class="avatar agent" style="width:24px;height:24px">AI</div>
        <span class="message-sender" style="margin-left:8px">RE Insight</span>
      </div>
      <div class="thinking">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="thinking-label">Generating SQL…</span>
      </div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
    return row;
  }

  function removeThinking() {
    const row = document.getElementById('thinking-row');
    if (row) row.remove();
  }

  function appendAgentResult(data) {
    const chatArea = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'message-row agent-row';

    const isNumeric = /^[₹\d\s,.Cr]+$/.test(data.formatted_result.trim());
    const isMultiRow = data.result.length > 1;

    let resultHTML = '';
    if (isMultiRow) {
      const rows = data.formatted_result.split('\n').map(r => {
        const cols = r.split(' | ');
        return `<tr>${cols.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`;
      }).join('');
      resultHTML = `<table class="result-table">${rows}</table>`;
    } else {
      const cls = isNumeric ? '' : 'text-result';
      resultHTML = `<div class="result-value ${cls}">${escapeHtml(data.formatted_result)}</div>`;
    }

    const sqlId = 'sql-' + Date.now();
    row.innerHTML = `
      <div class="message-header">
        <div class="avatar agent">AI</div>
        <span class="message-sender">RE Insight</span>
        <span class="message-time">
          ${getTime()}
          <span class="duration-badge">⚡ ${data.duration_ms}ms</span>
        </span>
      </div>
      <div class="result-card">
        <div class="result-answer">
          <div class="result-label">Result</div>
          ${resultHTML}
        </div>
        <button class="sql-toggle" onclick="toggleSQL('${sqlId}', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          View generated SQL
        </button>
        <div class="sql-block" id="${sqlId}">
          <pre>${highlightSQL(escapeHtml(data.sql))}</pre>
        </div>
      </div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function appendErrorResult(message) {
    const chatArea = document.getElementById('chat-area');
    const row = document.createElement('div');
    row.className = 'message-row agent-row';
    row.innerHTML = `
      <div class="message-header">
        <div class="avatar agent">AI</div>
        <span class="message-sender">RE Insight</span>
        <span class="message-time">${getTime()}</span>
      </div>
      <div class="error-card">⚠ ${escapeHtml(message)}</div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function toggleSQL(id, btn) {
    const block = document.getElementById(id);
    block.classList.toggle('visible');
    btn.classList.toggle('open');
    btn.querySelector('span') && (btn.querySelector('span').textContent =
      block.classList.contains('visible') ? 'Hide SQL' : 'View generated SQL');
    // Update text node
    const textNodes = [...btn.childNodes].filter(n => n.nodeType === 3);
    if (textNodes.length) {
      textNodes[textNodes.length - 1].textContent = block.classList.contains('visible')
        ? ' Hide SQL' : ' View generated SQL';
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Send ──
  async function sendQuestion() {
    if (isLoading) return;
    const input = document.getElementById('question-input');
    const question = input.value.trim();
    if (!question) return;

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    messageCount++;
    updateMsgCount();
    appendUserMessage(question);
    const thinkingRow = appendThinking();

    // Cycle thinking labels
    const labels = ['Generating SQL…', 'Running query…', 'Formatting result…'];
    let li = 0;
    const labelInterval = setInterval(() => {
      li = (li + 1) % labels.length;
      const el = document.getElementById('thinking-label');
      if (el) el.textContent = labels[li];
    }, 1200);

    try {
      const resp = await fetch(`${API_URL}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      clearInterval(labelInterval);
      removeThinking();

      if (!resp.ok) {
        const err = await resp.json();
        appendErrorResult(err.detail || 'Unknown error from server.');
      } else {
        const data = await resp.json();
        messageCount++; // agent reply
        updateMsgCount();
        appendAgentResult(data);
      }

    } catch (e) {
      clearInterval(labelInterval);
      removeThinking();
      appendErrorResult('Could not reach the server. Make sure the backend is running on port 8000.');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  // ── Health check ──
  async function checkHealth() {
    try {
      const r = await fetch(`${API_URL}/health`);
      const statusEl = document.getElementById('status-text');
      const dot = document.querySelector('.status-dot');
      if (r.ok) {
        statusEl.textContent = 'Connected to database';
        dot.style.background = 'var(--success)';
      } else {
        statusEl.textContent = 'Backend offline';
        dot.style.background = 'var(--error)';
      }
    } catch {
      const statusEl = document.getElementById('status-text');
      const dot = document.querySelector('.status-dot');
      statusEl.textContent = 'Backend offline';
      dot.style.background = 'var(--error)';
    }
  }

  checkHealth();
  setInterval(checkHealth, 15000);

  document.getElementById('question-input').focus();
</script>
</body>
</html>
